<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Shipping Verification | Operations</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="shell">
            <header>
                <div>
                    <div class="eyebrow" id="deployment-state">
                        Shipping operations
                    </div>
                    <h1>Document verification</h1>
                    <p class="subtitle">
                        AI understands. Rules verify. Humans resolve exceptions.
                        <span id="ai-state"></span>
                    </p>
                </div>
            </header>
            <main id="dashboard-view">
                <div
                    id="metrics"
                    class="metrics"
                    aria-label="Case summary filters"
                ></div>
                <section class="card">
                    <div class="card-head">
                        <h2>Cases</h2>
                        <span id="case-count" class="muted"></span>
                    </div>
                    <div
                        id="quick-filters"
                        class="quick-filters"
                        aria-label="Quick filters"
                    ></div>
                    <div class="toolbar">
                        <input
                            id="search"
                            placeholder="Search case, sender, or subject"
                            aria-label="Search cases"
                        /><select
                            id="category-filter"
                            aria-label="Filter category"
                        >
                            <option value="all">All categories</option>
                            <option value="BL_COMPARISON">
                                Document comparison
                            </option>
                            <option value="SI_REQUEST">SI request</option>
                            <option value="INVOICE_QUERY">Invoice query</option>
                            <option value="GENERAL">General</option>
                            <option value="SPAM">Spam</option></select
                        ><select
                            id="status-filter"
                            aria-label="Filter verification status"
                        >
                            <option value="all">All statuses</option>
                            <option value="PROCESSING">Processing</option>
                            <option value="OK">No mismatch detected</option>
                            <option value="MISMATCH">Mismatch detected</option>
                            <option value="NEEDS_REVIEW">
                                Human review required
                            </option>
                            <option value="PROCESSING_FAILED">
                                Processing failed
                            </option>
                            <option value="NOT_APPLICABLE">
                                Not applicable
                            </option>
                        </select>
                    </div>
                    <div class="table-scroll">
                        <table class="master">
                            <thead>
                                <tr>
                                    <th>Email</th>
                                    <th>Sender</th>
                                    <th>Classification</th>
                                    <th>Verification status</th>
                                    <th>Documents</th>
                                    <th>Updated</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="case-table"></tbody>
                        </table>
                    </div>
                </section>
            </main>
            <main id="case-view" class="hidden">
                <button id="back-button" class="back">← Dashboard</button>
                <div id="case-content" aria-live="polite"></div>
            </main>
        </div>
        <script src="dashboard.js"></script>
    </body>
</html>
