<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping Verification | Operations</title>
<style>
  :root{font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:#142a3b;background:#eef3f6}
  *{box-sizing:border-box} body{margin:0} button,input,select,textarea{font:inherit}
  button{cursor:pointer} .shell{max-width:1650px;margin:auto;padding:22px 28px 50px}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
  h1{font-size:23px;margin:0} h2{font-size:19px;margin:0 0 12px} h3{font-size:15px;margin:0 0 10px}
  .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:750;color:#24727b}
  .subtitle,.muted{color:#62788a} .subtitle{margin:4px 0 0}
  nav{display:flex;background:#fff;border:1px solid #dbe5eb;border-radius:10px;padding:4px}
  nav button{border:0;background:transparent;padding:9px 16px;border-radius:7px;color:#536d7b;font-weight:650}
  nav button.active{background:#0a6170;color:#fff}
  .metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}
  .metric,.card{background:#fff;border:1px solid #dbe5eb;border-radius:12px;box-shadow:0 2px 10px #20405708}
  .metric{padding:14px 17px}.metric strong{display:block;font-size:24px;letter-spacing:-.035em}.metric span{color:#657b8a;font-size:12px}
  .workspace{display:grid;grid-template-columns:minmax(520px,1.08fr) minmax(480px,1fr);gap:15px;align-items:start}
  .card{padding:18px;min-width:0}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .card-head h2{margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 13px}
  input,select,textarea{border:1px solid #c9d7df;border-radius:7px;padding:8px 10px;background:#fff;color:#193345;min-width:0}
  #search{flex:1;min-width:170px} select{max-width:190px} textarea{width:100%;resize:vertical}
  .scroll{max-height:70vh;overflow:auto} table{width:100%;border-collapse:collapse;table-layout:fixed} th,td{text-align:left;vertical-align:top;padding:11px 7px;border-bottom:1px solid #e7eef2;overflow-wrap:anywhere}
  #queue th:nth-child(1),.scroll th:nth-child(1){width:26%}.scroll th:nth-child(2){width:25%}.scroll th:nth-child(3){width:25%}.scroll th:nth-child(4){width:7%}.scroll th:nth-child(5){width:17%}
  th{position:sticky;top:0;background:#f6f9fb;color:#6b7f8d;font-size:11px;text-transform:uppercase;letter-spacing:.06em;z-index:1}
  tr.clickable{cursor:pointer} tr.clickable:hover,tr.selected{background:#eaf5f6}
  .subject{font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sender{font-size:12px;color:#688090;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:750;white-space:nowrap;background:#eef3f6;color:#486373}
  .badge.OK{background:#e1f5eb;color:#186b4b}.badge.MISMATCH{background:#fff0dc;color:#9a5711}.badge.NEEDS_REVIEW{background:#fce7e6;color:#9b3e37}
  .badge.BL_COMPARISON{background:#e6f3fb;color:#1a668b}
  .detail{max-height:calc(100vh - 175px);overflow:auto;position:sticky;top:16px}
  .detail section{border-top:1px solid #e5edf1;padding-top:16px;margin-top:16px}.detail section:first-child{border-top:0;padding-top:0;margin-top:0}
  .meta{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:10px 0}.meta dt{color:#6b7f8d}.meta dd{margin:0;overflow-wrap:anywhere}
  .email-body,.doc-text,.draft{white-space:pre-wrap;background:#f5f8fa;border:1px solid #e1eaf0;padding:13px;border-radius:8px;max-height:135px;overflow:auto}
  .doc-text{max-height:340px}.file-list{display:flex;gap:8px;flex-wrap:wrap}.file{border:1px solid #bfd4dd;background:#f4fafb;border-radius:8px;padding:9px;text-align:left;min-width:160px;max-width:100%;color:#174b5b}
  .file small{display:block;color:#5d7b86}.file.active{outline:2px solid #0a7180}iframe{width:100%;height:380px;border:1px solid #d6e1e8;border-radius:7px}
  .compare{font-size:12px}.compare th,.compare td{padding:8px 7px}.compare .raw{font-weight:620}.compare .sub{display:block;color:#647d8c;margin-top:3px;font-size:11px;overflow-wrap:anywhere}
  .compare tr.mismatch{background:#fff8ec}.compare tr.uncertain{background:#fff5f4}
  .result{font-weight:750}.result.match{color:#20704f}.result.mismatch{color:#a65b09}.result.review{color:#a6423b}
  .alert{border-left:4px solid #d18c37;background:#fff7eb;padding:10px 12px;border-radius:5px;margin:8px 0}.alert.review{border-color:#c9685e;background:#fff3f1}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button,.small-btn{border:0;border-radius:7px;padding:8px 11px;background:#0b6976;color:white;font-weight:650}
  .actions button.secondary,.small-btn.secondary{background:#e6eef2;color:#245064}.form-row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.form-row>*{flex:1;min-width:120px}
  .notice{padding:10px 12px;background:#e9f5fa;border-radius:7px;color:#225c77}.error{background:#fce8e6;color:#9c3930}
  .analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.bar-row{display:grid;grid-template-columns:165px 1fr 45px;gap:8px;align-items:center;margin:10px 0}.track{height:10px;background:#e7eff3;border-radius:20px;overflow:hidden}.fill{height:100%;background:#0b7180}
  .hidden{display:none!important}
  @media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.workspace{grid-template-columns:1fr}.detail{position:static;max-height:none}}
  @media(max-width:650px){.shell{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}header{display:block}nav{margin-top:13px}.scroll{max-height:360px}.analytics-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="eyebrow" id="deployment-state">Shipping operations</div><h1>Document verification</h1><p class="subtitle">AI understands. Rules verify. Humans resolve exceptions. <span id="ai-state"></span></p></div>
    <nav aria-label="Main views"><button data-view="inbox" class="active">Inbox</button><button data-view="review">Human review</button><button data-view="analytics">Analytics</button></nav>
  </header>
  <div id="metrics" class="metrics"></div>
  <main id="workflow" class="workspace">
    <section class="card">
      <div class="card-head"><h2 id="queue-title">Incoming emails</h2><span id="queue-count" class="muted"></span></div>
      <div class="toolbar"><input id="search" placeholder="Search ID, sender, or subject" aria-label="Search inbox"><select id="category-filter" aria-label="Filter category"><option value="all">All categories</option><option value="BL_COMPARISON">Document comparison</option><option value="SI_REQUEST">SI request</option><option value="INVOICE_QUERY">Invoice query</option><option value="GENERAL">General</option><option value="SPAM">Spam</option></select><select id="status-filter" aria-label="Filter status"><option value="all">All results</option><option value="OK">OK</option><option value="MISMATCH">Mismatch</option><option value="NEEDS_REVIEW">Review required</option></select></div>
      <div class="scroll"><table><thead><tr><th>Email / sender</th><th>Subject</th><th>Classification</th><th>Files</th><th>Result</th></tr></thead><tbody id="queue"></tbody></table></div>
    </section>
    <article id="detail" class="card detail" aria-live="polite"><p class="muted">Select an email to inspect the case.</p></article>
  </main>
  <main id="analytics" class="analytics-grid hidden"></main>
</div>
<script>
const FIELDS=['shipper','consignee','notify_party','port_of_loading','port_of_discharge','container_count','gross_weight_kg'];
const LABEL={BL_COMPARISON:'Document comparison',SI_REQUEST:'SI request',INVOICE_QUERY:'Invoice query',GENERAL:'General',SPAM:'Spam',OK:'OK',MISMATCH:'Mismatch',NEEDS_REVIEW:'Review required'};
const $=id=>document.getElementById(id);
const node=(tag,text='',className='')=>{const x=document.createElement(tag);x.textContent=text??'';x.className=className;return x};
const add=(parent,...children)=>{parent.append(...children);return parent};
const apiPath=(kind,id,index)=>'/api/'+kind+'/'+encodeURIComponent(id)+(index===undefined?'':'/'+index);
let state={cases:{},decisions:{},metrics:{},view:'inbox',selected:null,email:null,preview:null};
async function request(url,body){const response=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Request failed');return result}
async function load(){try{const data=await request('/api/cases');Object.assign(state,data);$('deployment-state').textContent='Shipping operations · '+(state.features?.cloud_mode?'Cloud application':'Local prototype');$('ai-state').textContent=state.features?.ai_enabled?'Gemini fallback active.':'Gemini fallback awaiting configuration.';if(!state.selected)state.selected=new URLSearchParams(location.search).get('case')||Object.keys(state.cases)[0];render();if(state.selected)await selectCase(state.selected)}catch(error){$('detail').replaceChildren(node('p',error.message,'notice error'))}}
function metric(title,value){return add(node('div','','metric'),node('strong',value),node('span',title))}
function render(){const m=state.metrics;$('metrics').replaceChildren(metric('Emails processed',m.total||0),metric('Document requests',m.comparison_requests||0),metric('Automatically cleared',m.automatically_cleared||0),metric('Mismatches',m.mismatches||0),metric('Needs human review',m.human_review||0),metric('Processing failures',m.processing_failures||0));
  $('workflow').classList.toggle('hidden',state.view==='analytics');$('analytics').classList.toggle('hidden',state.view!=='analytics');document.querySelectorAll('nav button').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));
  if(state.view==='analytics')renderAnalytics();else renderQueue();}
function visibleCases(){const search=$('search').value.toLowerCase(),category=$('category-filter').value,status=$('status-filter').value;
  return Object.entries(state.cases).filter(([id,c])=>{const e=c.email||{};return (state.view!=='review'||c.status==='NEEDS_REVIEW')&&(category==='all'||c.category===category)&&(status==='all'||c.status===status)&&[id,e.from,e.subject].some(v=>String(v||'').toLowerCase().includes(search))})}
function renderQueue(){const entries=visibleCases();$('queue-title').textContent=state.view==='review'?'Human review queue':'Incoming emails';$('queue-count').textContent=entries.length+' cases';
  $('queue').replaceChildren(...entries.map(([id,c])=>{const e=c.email||{},tr=node('tr','','clickable'+(state.selected===id?' selected':''));tr.tabIndex=0;tr.onclick=()=>selectCase(id);tr.onkeydown=event=>{if(event.key==='Enter')selectCase(id)};
    const identity=add(node('td'),node('strong',id),node('div',e.from||'Unknown sender','sender'));
    tr.append(identity,node('td',e.subject||'No subject','subject'),add(node('td'),node('span',LABEL[c.category]||c.category,'badge '+c.category),node('div',Math.round((c.classification?.confidence||0)*100)+'% confidence','sender')),node('td',String(e.attachments?.length||0)),add(node('td'),node('span',LABEL[c.status]||c.status,'badge '+c.status)));
    return tr}));}
async function selectCase(id){state.selected=id;renderQueue();try{state.email=await request(apiPath('email',id));renderDetail(id);$('detail').scrollTop=0}catch(error){$('detail').replaceChildren(node('p',error.message,'notice error'))}}
function metadata(label,value){return [node('dt',label),node('dd',value||'—')]}
function section(title){return add(node('section'),node('h3',title))}
function renderDetail(id){const c=state.cases[id],e=state.email||c.email||{},panel=$('detail');panel.replaceChildren();
  const top=section('Email detail');top.append(node('div',id+' · '+(LABEL[c.status]||c.status),'eyebrow'),node('h2',e.subject||'No subject'));
  const meta=add(node('dl','','meta'),...metadata('From',e.from),...metadata('To',e.to),...metadata('Classification',(LABEL[c.category]||c.category)+' · '+Math.round((c.classification?.confidence||0)*100)+'% · '+(c.classification?.method||'rules')),...metadata('Reason',c.classification?.reason));top.append(meta,node('div',e.body||'No email body','email-body'));panel.append(top);
  const files=section('Attachments and document roles'),paths=e.attachments||[];
  if(!paths.length)files.append(node('p','No attachments were supplied.','notice error'));
  else{const list=node('div','','file-list');paths.forEach((path,index)=>{const role=c.documents?.si===path?'Reference / SI':c.documents?.bl===path?'Draft BL':'Other / unassigned';const button=add(node('button','','file'),node('strong',path.split('/').pop()),node('small',role));button.onclick=()=>preview(id,index,path,files);list.append(button)});files.append(list);if(c.document_identification)files.append(node('p','Document identification: '+c.document_identification.method+' · '+Math.round(c.document_identification.confidence*100)+'%','muted'));files.append(node('div','', 'preview-slot'))}panel.append(files);
  if(c.category==='BL_COMPARISON')renderComparison(c,panel);
  renderReview(c,panel);
}
async function preview(id,index,path,sectionNode){const slot=sectionNode.querySelector('.preview-slot');slot.replaceChildren(node('p','Loading '+path+'…','muted'));
  const select=add(node('div','','actions'),button('Use as SI',()=>selectDocument(id,'si',path),'secondary'),button('Use as draft BL',()=>selectDocument(id,'bl',path),'secondary'));
  try{if(path.toLowerCase().endsWith('.pdf')){const frame=node('iframe');frame.src=apiPath('attachment',id,index);frame.title=path;slot.replaceChildren(select,frame)}
    else{const doc=await request(apiPath('document',id,index));slot.replaceChildren(select,node('pre',doc.text,'doc-text'))}}
  catch(error){slot.replaceChildren(select,node('p',error.message,'notice error'))}}
function button(label,handler,style=''){const b=node('button',label,style);b.onclick=handler;return b}
function fieldResult(a,b){if(!a||!b||a.normalized_value==null||b.normalized_value==null)return ['Needs review','review'];return a.normalized_value===b.normalized_value?['Match','match']:['Mismatch','mismatch']}
function fieldCell(f){const td=node('td');if(!f)return add(td,node('span','Missing','muted'));td.append(node('div',f.raw_value,'raw'),node('span','Normalized: '+String(f.normalized_value??'missing'),'sub'),node('span',(f.source_text||f.source||'')+' · '+Math.round((f.confidence||0)*100)+'% '+(f.method||''),'sub'));return td}
function renderComparison(c,panel){const sectionNode=section('Document comparison');if(c.documents)sectionNode.append(node('p','Reference: '+(c.documents.si||'Unidentified')+'  |  Draft BL: '+(c.documents.bl||'Unidentified'),'muted'));
  const table=node('table','','compare');table.append(add(node('thead'),add(node('tr'),...['Field','Shipping Instruction','Draft BL','Result'].map(t=>node('th',t)))));const body=node('tbody');
  FIELDS.forEach(name=>{const si=c.si_fields?.[name],bl=c.bl_fields?.[name],[label,kind]=fieldResult(si,bl);const row=node('tr','',kind==='mismatch'?'mismatch':kind==='review'?'uncertain':'');row.append(node('td',name.replaceAll('_',' ')),fieldCell(si),fieldCell(bl),node('td',label,'result '+kind));body.append(row)});table.append(body);sectionNode.append(table);
  for(const mismatch of c.mismatches||[]){const card=node('div','','alert');card.append(node('strong',mismatch.field.replaceAll('_',' ')+' differs'),node('div',mismatch.reason),node('div','SI: '+mismatch.si.source_text+' | BL: '+mismatch.bl.source_text,'muted'));sectionNode.append(card)}
  if(c.validation){const lines=[];if(c.validation.pairing?.conflicts?.length)lines.push('Conflicting shipment identifiers: '+c.validation.pairing.conflicts.join(', '));for(const [role,result] of Object.entries(c.validation.consistency||{}))if(!result.valid)lines.push(role.toUpperCase()+': '+result.evidence);if(lines.length)sectionNode.append(node('div',lines.join('\n'),'notice error'))}
  panel.append(sectionNode)}
function renderReview(c,panel){const sectionNode=section(c.status==='NEEDS_REVIEW'?'Human review required':'Reviewer feedback');
  if(c.status==='NEEDS_REVIEW'){const reason=c.internal_reason||c.review_reason||'Uncertain case';sectionNode.append(node('div',reason.replaceAll('_',' ')+' · '+reviewGuidance(c),'notice error'));if(c.missing_fields?.length)sectionNode.append(node('p','Missing: '+c.missing_fields.join(', ')));if(c.uncertain_fields?.length)sectionNode.append(node('p','Low confidence: '+c.uncertain_fields.join(', ')));if(c.error)sectionNode.append(node('pre',c.error,'doc-text'))}
  const saved=state.decisions[c.email_id];if(saved)sectionNode.append(node('p','Last reviewer action: '+saved.action+(saved.note?' · '+saved.note:''),'notice'));
  if(c.category==='BL_COMPARISON'){
    const controls=node('div','','actions');if(c.status==='MISMATCH')controls.append(button('Confirm mismatch',()=>decision(c.email_id,'confirm')));controls.append(button('Confirm value',()=>decision(c.email_id,'confirm_value'),'secondary'),button('Retry extraction',()=>retry(c.email_id),'secondary'),button('Resolve case',()=>decision(c.email_id,'resolve'),'secondary'));sectionNode.append(controls);
    const row=node('div','','form-row'),role=node('select'),field=node('select'),value=node('input');role.append(node('option','SI'),node('option','BL'));FIELDS.forEach(f=>{const option=node('option',f.replaceAll('_',' '));option.value=f;field.append(option)});value.placeholder='Correct value';row.append(role,field,value);sectionNode.append(row);
    sectionNode.append(add(node('div','','actions'),button('Save corrected value',()=>decision(c.email_id,'correct',{role:role.value.toLowerCase(),field:field.value,value:value.value})),button('Mark selected field equivalent',()=>decision(c.email_id,'mark_equivalent',{field:field.value}),'secondary')));
    if(c.status==='MISMATCH'&&saved?.action==='confirm')sectionNode.append(button('Draft correction email',()=>draft(c.email_id,sectionNode),'secondary'));
  }else sectionNode.append(button('Resolve case',()=>decision(c.email_id,'resolve'),'secondary'));
  panel.append(sectionNode)}
function reviewGuidance(c){const code=c.internal_reason||'';if(code.includes('MISSING'))return 'Check the missing document or field, then correct it or select the right attachment.';if(code.includes('WRONG_DOCUMENT')||code.includes('AMBIGUOUS_DOCUMENT'))return 'Open the attachments and choose the correct SI and draft BL.';if(code.includes('INCONSISTENCY'))return 'Check container rows and totals against the source document.';if(code.includes('CONFIDENCE')||code.includes('UNREADABLE'))return 'Inspect the source document and confirm or correct the extracted value.';return 'Inspect the document evidence before resolving.'}
async function decision(id,action,extra={}){try{const note=prompt('Reviewer note (optional):','');if(note===null)return;await request(apiPath('decision',id),{action,note,...extra});await load()}catch(error){alert(error.message)}}
async function retry(id){try{await request(apiPath('retry',id),{});await load()}catch(error){alert(error.message)}}
async function selectDocument(id,role,path){try{await request(apiPath('select_document',id),{role,path});await load()}catch(error){alert(error.message)}}
async function draft(id,sectionNode){try{const result=await request(apiPath('draft',id),{});sectionNode.append(node('pre',result.draft,'draft'))}catch(error){alert(error.message)}}
function renderAnalytics(){const m=state.metrics,area=$('analytics');area.replaceChildren();const cards=[['Email classification',m.categories||{}],['Verification results',m.statuses||{}]];
  cards.forEach(([title,values])=>{const box=add(node('section','','card'),node('h2',title));const max=Math.max(1,...Object.values(values));for(const [name,count] of Object.entries(values)){const row=node('div','','bar-row');row.append(node('span',LABEL[name]||name),add(node('div','','track'),node('div','','fill')),node('strong',count));row.querySelector('.fill').style.width=(count/max*100)+'%';box.append(row)}area.append(box)});
  const rates=add(node('section','','card'),node('h2','Operational summary'),node('p','Automation rate for document comparison requests: '+Math.round((m.automation_rate||0)*100)+'%'),node('p','Human review cases: '+(m.human_review||0)),node('p','AI assisted cases: '+(m.ai_assisted_cases||0)),node('p','Processing failures: '+(m.processing_failures||0)));area.append(rates)}
document.querySelectorAll('nav button').forEach(button=>button.onclick=()=>{state.view=button.dataset.view;render()});$('search').oninput=renderQueue;$('category-filter').onchange=renderQueue;$('status-filter').onchange=renderQueue;load();
</script>
</body>
</html>
